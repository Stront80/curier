name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: curier_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d curier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/curier_test
      HTTP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/curier_http_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Create isolated HTTP integration-test database
        run: node -e "const {Client}=require('pg'); (async()=>{const c=new Client({connectionString:'postgres://postgres:postgres@localhost:5432/postgres'}); await c.connect(); try { await c.query('CREATE DATABASE curier_http_test'); } finally { await c.end(); }})().catch(e=>{console.error(e);process.exit(1)})"
      - run: npm run build
      - run: npm test
